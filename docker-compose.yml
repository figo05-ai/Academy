services:
  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: academy_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - academy_network

  # Nginx Web Server Service
  nginx:
    image: nginx:alpine
    container_name: academy_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - academy_network

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: academy_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - academy_db_data:/var/lib/mysql
    networks:
      - academy_network

  # Redis Service
  redis:
    image: redis:alpine
    container_name: academy_redis
    restart: unless-stopped
    volumes:
      - academy_redis_data:/data
    networks:
      - academy_network

  # Queue Worker Service
  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: academy_worker
    restart: unless-stopped
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    volumes:
      - ./:/var/www
    depends_on:
      - redis
    networks:
      - academy_network

networks:
  academy_network:
    driver: bridge

volumes:
  academy_db_data:
    driver: local
  academy_redis_data:
    driver: local
