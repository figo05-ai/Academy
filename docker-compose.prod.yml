services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: academy_app_prod
    restart: always
    working_dir: /var/www
    volumes:
      - shared_public:/var/www/public
      - ./.env:/var/www/.env
    networks:
      - academy_network

  nginx:
    image: nginx:alpine
    container_name: academy_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - shared_public:/var/www/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - academy_network

  db:
    image: mysql:8.0
    container_name: academy_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - academy_db_data:/var/lib/mysql
    networks:
      - academy_network

  redis:
    image: redis:alpine
    container_name: academy_redis_prod
    restart: always
    volumes:
      - academy_redis_data:/data
    networks:
      - academy_network

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: academy_worker_prod
    restart: always
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    depends_on:
      - redis
    volumes:
      - ./.env:/var/www/.env
    networks:
      - academy_network

networks:
  academy_network:
    driver: bridge

volumes:
  academy_db_data:
  academy_redis_data:
  shared_public:
