server {
    listen 80;

    server_name
        the-technical-office-for-landscaping-works.com
        www.the-technical-office-for-landscaping-works.com;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;

    server_name
        the-technical-office-for-landscaping-works.com
        www.the-technical-office-for-landscaping-works.com;

    root /var/www/public;

    index index.php;

    charset utf-8;

    server_tokens off;

    client_max_body_size 50m;


    ssl_certificate
        /etc/letsencrypt/live/the-technical-office-for-landscaping-works.com/fullchain.pem;

    ssl_certificate_key
        /etc/letsencrypt/live/the-technical-office-for-landscaping-works.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers
        'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';

    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;

    ssl_session_timeout 1d;

    ssl_session_tickets off;


    add_header Strict-Transport-Security
        "max-age=31536000" always;

    add_header X-Frame-Options
        "SAMEORIGIN" always;

    add_header X-Content-Type-Options
        "nosniff" always;

    add_header Referrer-Policy
        "strict-origin-when-cross-origin" always;


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    location ^~ /build/ {
        try_files $uri =404;

        access_log off;

        expires off;

        add_header Cache-Control
            "public, max-age=31536000, immutable" always;

        add_header Strict-Transport-Security
            "max-age=31536000" always;

        add_header X-Frame-Options
            "SAMEORIGIN" always;

        add_header X-Content-Type-Options
            "nosniff" always;

        add_header Referrer-Policy
            "strict-origin-when-cross-origin" always;
    }


    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }


    location = /robots.txt {
        access_log off;
        log_not_found off;
    }


    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;

        fastcgi_pass app:9000;

        fastcgi_param SCRIPT_FILENAME
            $realpath_root$fastcgi_script_name;

        fastcgi_param DOCUMENT_ROOT
            $realpath_root;

        fastcgi_param HTTPS on;

        fastcgi_param HTTP_X_FORWARDED_PROTO https;

        fastcgi_read_timeout 120s;

        fastcgi_send_timeout 120s;
    }


    location ~ /\.(?!well-known).* {
        deny all;
    }
}
