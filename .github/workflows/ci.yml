name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------------------
  # Job 1: CI - Security Scanning and Image Building
  # ---------------------------------------------------------
  security-and-build:
    name: Security Scan and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Build Production Docker Image
        run: docker build -t academy-app:latest -f docker/app/Dockerfile .

      - name: Run Trivy Scanner (Docker Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'academy-app:latest'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  # ---------------------------------------------------------
  # Job 2: CD - Automated Deployment to AWS EC2
  # ---------------------------------------------------------
  deploy:
    name: Deploy to Production (AWS EC2)
    needs: security-and-build
    runs-on: ubuntu-latest
    # Execute deployment only when pushing to the main branch
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Execute Deployment Script via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail

            # Define the project directory on the target server
            PROJECT_DIR="/home/ubuntu/Academy"
            
            echo "--> Navigating to project directory"
            cd "$PROJECT_DIR"
            
            echo "--> Syncing repository cleanly with origin/main"
            git fetch origin main
            git reset --hard origin/main
            
            echo "--> Stopping any conflicting dev containers"
            docker compose -f docker-compose.yml down 2>/dev/null || true
            docker stop academy_nginx 2>/dev/null || true
            docker rm academy_nginx 2>/dev/null || true

            echo "--> Building new Docker images for production"
            docker compose -f docker-compose.prod.yml build
            
            echo "--> Starting production containers in detached mode"
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            echo "--> Running database migrations"
            docker compose -f docker-compose.prod.yml exec -T app php artisan migrate --force || true
            
            echo "--> Clearing application caches"
            docker compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear || true
            
            echo "--> Removing dangling Docker images to optimize storage"
            docker image prune -f
            
            echo "--> Deployment sequence completed successfully."

