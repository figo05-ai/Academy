name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repository Files)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

      - name: Build Application Docker Image
        run: |
          docker build -t academy-app:latest -f docker/app/Dockerfile .

      - name: Run Trivy Vulnerability Scanner (Docker Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'academy-app:latest'
          format: 'table'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
