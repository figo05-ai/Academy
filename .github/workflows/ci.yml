name: Academy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: academy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php-quality:
    name: PHP 8.3 / Tests / Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, pdo_sqlite, sqlite3, pdo_mysql, bcmath, intl, gd, zip
          tools: composer:v2
          coverage: none

      - name: Validate Composer manifests
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Configure testing environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run Laravel tests
        run: php artisan test

      - name: Audit production PHP dependencies
        run: composer audit --locked --no-dev --format=summary

  frontend:
    name: Frontend Build / Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend assets
        run: npm run build

  repository-security:
    name: Trivy Repository Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan dependencies, secrets, and configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: '1'

  docker-image:
    name: Docker Image Build / Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - php-quality
      - frontend

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build application image
        run: |
          docker build \
            --file docker/app/Dockerfile \
            --tag academy-app:ci \
            .

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: academy-app:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          format: table
          exit-code: '1'
