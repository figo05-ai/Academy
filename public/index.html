<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>أعمال متدربين أكاديمية مكتب فني</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
        }
        .navbar {
            background-color: #333;
            color: white;
            padding: 15px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .main-container {
            display: flex;
            justify-content: center;
            padding: 40px 40px 0; /* تم تعديل الحشوة لوضع الخط بالأسفل */
            /* تمت إزالة التوسيط العمودي لوضع المربع أسفل شريط التنقل مباشرة */
            box-sizing: border-box;
        }
        .honor-box {
            background-color: white;
            padding: 40px 80px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            /* تم نقل هذا الخط ليكون عنصراً منفصلاً بعرض الصفحة الكاملة */
        }
        .honor-box h2 {
            margin: 0;
            font-size: 36px;
            color: #333;
        }
        /* === Carousel Styles Start === */
        .carousel-container {
            position: relative;
            height: 350px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* لإخفاء أي عناصر تخرج عن الإطار */
            margin-top: 20px;
            cursor: grab; /* إضافة مؤشر السحب الافتراضي */
            user-select: none; /* منع تحديد النصوص أو الأيقونات بالخطأ أثناء السحب */
            -webkit-user-select: none;
        }

        .carousel-card {
            position: absolute;
            background-color: #f0f0f0;
            border: 3px solid #aaa;
            border-radius: 15px;
            padding: 25px; /* تقليل الحواف الداخلية ليتناسب مع الصورة الأكبر */
            display: flex;
            flex-direction: column; /* لوضع النص تحت الأيقونة */
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease-in-out;
            cursor: pointer;
            /* الحالة الافتراضية للمربعات البعيدة */
            transform: scale(0.6);
            opacity: 0;
            filter: blur(5px);
            z-index: 1;
        }

        /* المربع في المنتصف (نشط) */
        .carousel-card.active {
            transform: scale(1.2);
            opacity: 1;
            filter: blur(0);
            z-index: 3;
            border-color: #333;
        }

        /* المربع السابق (على اليسار) */
        .carousel-card.prev {
            transform: translateX(-180px) scale(0.8);
            opacity: 0.7;
            filter: blur(4px);
            z-index: 2;
        }

        /* المربع التالي (على اليمين) */
        .carousel-card.next {
            transform: translateX(180px) scale(0.8);
            opacity: 0.7;
            filter: blur(4px);
            z-index: 2;
        }

        /* تعطيل الانتقال السلس أثناء السحب ليتبع الماوس فوراً دون تأخير */
        .carousel-container.dragging .carousel-card {
            transition: none;
        }

        .carousel-img {
            width: 280px; /* عرض أكبر للصورة */
            height: 180px; /* طول متناسق مع العرض (شكل مستطيل) */
            object-fit: cover; /* يملأ المساحة بدون تشويه */
            border-radius: 10px; /* حواف دائرية بسيطة للصورة */
            margin-bottom: 20px; /* مسافة كافية لشعار فيسبوك بالأسفل */
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(51, 51, 51, 0.6);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            transition: background-color 0.3s;
        }
        .carousel-btn:hover {
            background-color: #333;
        }
        .carousel-btn--prev { left: 30px; }
        .carousel-btn--next { right: 30px; }

        .facebook-logo {
            position: absolute;
            bottom: 15px;
            left: 15px;
            font-size: 16px;
            color: #1877F2;
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            opacity: 0; /* إخفاء الشعار افتراضياً */
            transform: translateY(10px); /* يبدأ من الأسفل قليلاً */
            text-decoration: none; /* إزالة الخط السفلي للرابط */
        }
        /* إظهار الشعار فقط في البطاقة النشطة */
        .carousel-card.active .facebook-logo {
            opacity: 1;
            transform: translateY(0); /* يعود إلى مكانه الأصلي */
        }
        .facebook-logo:hover {
            color: #166FE5; /* لون أغمق قليلاً عند التمرير */
        }

        .carousel-dots {
            text-align: center;
            margin-top: 20px;
        }
        .dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: #bbb;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .dot.active {
            background-color: #333;
        }

        /* === Boxes Section Styles Start === */
        .boxes-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 40px; /* إرجاع المربعات لمكانها الطبيعي وتنسيقها */
            margin-bottom: 40px;
            opacity: 0; /* الإخفاء الأولي للقسم */
            transform: translateY(40px); /* الإزاحة للأسفل قليلاً لعمل تأثير الصعود */
            transition: opacity 0.8s ease-out, transform 0.8s ease-out; /* حركة انسيابية */
        }
        .boxes-section.show {
            opacity: 1; /* إظهار القسم */
            transform: translateY(0); /* إعادته لمكانه الطبيعي */
        }

        .boxes-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .box-item {
            background-color: white;
            width: 300px; /* توحيد العرض لجميع المربعات */
            height: 220px; /* زيادة الارتفاع لعمل كارت متناسق واحترافي */
            box-sizing: border-box; /* لضمان بقاء الحجم ثابتاً مع الحشوة */
            padding: 0 20px 20px; /* تعديل الحشوة لتناسب العرض الثابت الجديد */
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            position: relative; /* تمت إضافته للسماح بتموضع الخط بداخله */
            overflow: hidden; /* لضمان عدم خروج الخط عن الزوايا الدائرية للمربع */
            transition: transform 0.3s ease, box-shadow 0.3s ease; /* إضافة انتقال سلس للحركة والظل */
            cursor: pointer; /* تغيير شكل الماوس ليدل على أن العنصر قابل للتفاعل */
        }

        .box-link {
            text-decoration: none; /* إزالة الخط السفلي للروابط */
            color: inherit; /* لجعل النص داخل الرابط يرث لونه الطبيعي */
        }

        .box-item h2 {
            margin: 172px 0 0; /* توسيط النص في المساحة السفلية الجديدة */
            font-size: 1.05rem; /* تصغير الخط درجة بسيطة ليكون متناسقاً جداً */
            font-weight: 600;
            color: #333;
            position: relative; /* لضمان ظهوره بشكل سليم فوق أي عناصر أخرى */
            z-index: 2;
            transition: color 0.3s ease; /* إضافة انتقال سلس لتغيير لون النص */
        }
        
        /* تغيير لون النص عند تمرير الماوس */
        .box-item:hover h2 {
            color: #1877F2;
        }

        /* تأثير الحركة عند تمرير الماوس */
        .box-item:hover {
            transform: translateY(-10px); /* رفع المربع للأعلى بمقدار 10 بكسل */
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.15); /* زيادة الظل لتعزيز إحساس الارتفاع */
        }
        
        /* تنسيق الأيقونات داخل المربعات */
        .box-icon {
            position: absolute;
            top: 0; /* تبدأ الصورة من أعلى المربع */
            left: 0; /* تبدأ من أقصى اليسار */
            width: 100%; /* تأخذ العرض بالكامل */
            height: 150px; /* إعطاء مساحة طولية أكبر للصور لتظهر بكامل تفاصيلها */
            object-fit: contain; /* عرض الصورة بالكامل دون قص (تأكل) أي جزء منها */
            object-position: center; /* توسيط الصورة من المنتصف دايماً */
            background-color: #fafafa; /* خلفية رمادية فاتحة جداً لتوحيد شكل الصور الشفافة والملونة */
            padding: 10px; /* مسافة بسيطة حتى لا تلتصق اللوجوهات بالحواف */
            box-sizing: border-box; /* لضمان عدم زيادة الحجم الكلي بسبب المسافة */
            transition: transform 0.4s ease;
            z-index: 0;
        }
        
        /* تكبير بسيط للصورة عند تمرير الماوس على المربع */
        .box-item:hover .box-icon {
            transform: scale(1.1) rotate(1deg); /* زووم مع ميلان خفيف جداً لشكل احترافي */
        }

        /* إضافة الخط السفلي داخل المربعات */
        .box-item::after {
            content: '';
            position: absolute;
            top: 150px; /* مطابقة مكان الخط مع نهاية مساحة الصورة */
            left: 0;
            width: 100%; /* عرض الخط ليكون بعرض المربع بالكامل */
            height: 4px; /* سمك الخط */
            background: linear-gradient(90deg, #1877F2, #00c6ff); /* خط أزرق متدرج احترافي */
            z-index: 1; /* لضمان ظهور الخط فوق الصورة */
            transition: height 0.3s ease;
        }
        
        /* تضخيم الخط الفاصل قليلاً عند تمرير الماوس */
        .box-item:hover::after {
            height: 6px;
        }
        /* === Carousel Styles End === */
    </style>
</head>

    <script>
        // 1. تحديد العناصر
        const carouselContainer = document.querySelector('.carousel-container');
        const cards = document.querySelectorAll('.carousel-card');
        const prevBtn = document.querySelector('.carousel-btn--prev');
        const nextBtn = document.querySelector('.carousel-btn--next');
        const dotsContainer = document.querySelector('.carousel-dots');

        // 2. تحديد الحالة الأولية
        let activeIndex = 0; // نبدأ من أول عنصر
        let autoPlayInterval; // متغير لتخزين المؤقت

        // 3. دالة لتحديث شريط التمرير
        const updateCarousel = () => {
            cards.forEach((card, i) => {
                // إزالة الكلاسات القديمة
                card.classList.remove('active', 'prev', 'next');

                // حساب المؤشرات (Index) للعناصر
                const prevIndex = (activeIndex - 1 + cards.length) % cards.length;
                const nextIndex = (activeIndex + 1) % cards.length;

                // إضافة الكلاسات الجديدة بناءً على الموضع
                if (i === activeIndex) card.classList.add('active');
                else if (i === prevIndex) card.classList.add('prev');
                else if (i === nextIndex) card.classList.add('next');
            });
            updateDots(); // تحديث النقاط مع كل تغيير
        };

        // دالة لتحديث النقاط
        const updateDots = () => {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === activeIndex);
            });
        };

        // دالات التنقل
        const goToNext = () => {
            activeIndex = (activeIndex + 1) % cards.length;
            updateCarousel();
        };
        const goToPrev = () => {
            activeIndex = (activeIndex - 1 + cards.length) % cards.length;
            updateCarousel();
        };

        // دالة لبدء/إعادة ضبط التشغيل التلقائي
        const startAutoPlay = () => {
            clearInterval(autoPlayInterval); // إيقاف المؤقت القديم إذا كان موجوداً
            autoPlayInterval = setInterval(goToNext, 1000); // بدء مؤقت جديد كل 5 ثوانٍ
        };

        // 4. إضافة مستمعي الأحداث (Event Listeners) للأزرار
        nextBtn.addEventListener('click', () => {
            goToNext();
            startAutoPlay(); // إعادة ضبط المؤقت عند النقر اليدوي
        });

        prevBtn.addEventListener('click', () => {
            goToPrev();
            startAutoPlay(); // إعادة ضبط المؤقت عند النقر اليدوي
        });

        // إيقاف التشغيل التلقائي عند تمرير الماوس واستئنافه عند الخروج
        carouselContainer.addEventListener('mouseenter', () => {
            clearInterval(autoPlayInterval); // إيقاف المؤقت دائما عند الدخول
            console.log('Autoplay Paused'); // للتأكد من عمل الكود
        });

        carouselContainer.addEventListener('mouseleave', () => {
            // استئناف التشغيل فقط إذا لم يكن المستخدم في منتصف عملية سحب
            if (!isDragging) {
                startAutoPlay();
            }
            console.log('Autoplay Resumed'); // للتأكد من عمل الكود
        });

        // إضافة إمكانية النقر على البطاقات الجانبية للتنقل
        cards.forEach(card => {
            card.addEventListener('click', () => {
                if (isDragged) return; // منع التفاعل كـ "نقر" إذا كان المستخدم للتو أنهى عملية سحب
                
                if (card.classList.contains('prev')) {
                    goToPrev();
                    startAutoPlay();
                } else if (card.classList.contains('next')) {
                    goToNext();
                    startAutoPlay();
                }
            });
        });

        // === إضافة خاصية السحب (Drag/Swipe) ===
        let isDragging = false;
        let isDragged = false; // متغير للتفريق بين النقر الفعلي وعملية السحب بالماوس
        let startPos = 0;
        let currentTranslate = 0;
        let prevTranslate = 0;

        // عند لمس الشاشة (touchstart)
        const handleDragStart = (e) => {
            isDragging = true;
            isDragged = false; // إعادة ضبط الحالة عند كل ضغطة جديدة
            // الحصول على موضع البدء سواء من الماوس أو اللمس
            startPos = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            clearInterval(autoPlayInterval); // إيقاف التشغيل التلقائي عند بدء السحب
            carouselContainer.style.cursor = 'grabbing'; // تغيير شكل المؤشر
            carouselContainer.classList.add('dragging'); // إضافة الكلاس لمنع الانتقال السلس مؤقتاً
        };

        // عند تحريك الإصبع أو الماوس
        const handleDragMove = (e) => {
            if (!isDragging) return;
            
            const currentPos = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
            const movedBy = currentPos - startPos;
            
            // إذا تحرك الماوس بمسافة أكثر من 10 بكسل، نعتبرها عملية سحب فعلية وليست نقرة
            if (Math.abs(movedBy) > 10) isDragged = true;

            // حساب نسبة السحب (نعتبر 180 بكسل هي المسافة الكاملة للانتقال)
            // نحدد النسبة بين -1 و 1 لضمان عدم تكبير/تصغير البطاقات عن الحد المسموح
            const dragRatio = Math.min(Math.max(movedBy / 180, -1), 1);
            
            // تقييد الحركة البصرية (Clamped) لكي لا تخرج البطاقات عن مسارها وتختفي عند السحب لمسافة طويلة
            const clampedMove = dragRatio * 180; 
            
            // تحريك البطاقات معاً وتحديث الأبعاد الثلاثية والشفافية والضبابية
            cards.forEach(card => {
                if (card.classList.contains('active')) {
                    const scale = 1.2 - Math.abs(dragRatio) * 0.4; // يصغر تدريجياً من 1.2 إلى 0.8
                    const opacity = 1 - Math.abs(dragRatio) * 0.3; // الشفافية تقل من 1 إلى 0.7
                    const blur = Math.abs(dragRatio) * 4; // الضبابية تزيد من 0 إلى 4px
                    const rotate = dragRatio * -25; // الدوران 3D للبطاقة النشطة
                    const shadowX = rotate * -1; // الظل يتحرك عكس الدوران
                    const glarePos = 50 + (rotate * 2); // حركة اللمعة
                    const glareOpacity = (Math.abs(rotate) / 25) * 0.6; // الشفافية تزيد مع الدوران
                    card.style.transform = `translateX(${clampedMove}px) scale(${scale}) rotateY(${rotate}deg)`;
                    card.style.opacity = opacity;
                    card.style.filter = `blur(${blur}px)`;
                    card.style.boxShadow = `${shadowX}px 15px ${10 + scale * 10}px rgba(0,0,0,${scale * 0.15})`;
                    card.style.setProperty('--glare-pos', `${glarePos}%`);
                    card.style.setProperty('--glare-opacity', glareOpacity);
                } else if (card.classList.contains('prev')) {
                    const scale = 0.8 + Math.max(0, dragRatio) * 0.4; // يكبر فقط إذا سحبنا لليمين
                    const opacity = 0.7 + Math.max(0, dragRatio) * 0.3; // الشفافية تزيد إلى 1
                    const blur = 4 - Math.max(0, dragRatio) * 4; // الضبابية تقل من 4px إلى 0
                    const rotate = 25 - Math.max(0, dragRatio) * 25; // تعديل الدوران 3D
                    const shadowX = rotate * -1;
                    const glarePos = 50 + (rotate * 2);
                    const glareOpacity = (Math.abs(rotate) / 25) * 0.6;
                    card.style.transform = `translateX(${-180 + clampedMove}px) scale(${scale}) rotateY(${rotate}deg)`;
                    card.style.opacity = opacity;
                    card.style.filter = `blur(${blur}px)`;
                    card.style.boxShadow = `${shadowX}px 15px ${10 + scale * 10}px rgba(0,0,0,${scale * 0.15})`;
                    card.style.setProperty('--glare-pos', `${glarePos}%`);
                    card.style.setProperty('--glare-opacity', glareOpacity);
                } else if (card.classList.contains('next')) {
                    const scale = 0.8 + Math.max(0, -dragRatio) * 0.4; // يكبر فقط إذا سحبنا لليسار
                    const opacity = 0.7 + Math.max(0, -dragRatio) * 0.3; // الشفافية تزيد إلى 1
                    const blur = 4 - Math.max(0, -dragRatio) * 4; // الضبابية تقل من 4px إلى 0
                    const rotate = -25 + Math.max(0, -dragRatio) * 25; // تعديل الدوران 3D
                    const shadowX = rotate * -1;
                    const glarePos = 50 + (rotate * 2);
                    const glareOpacity = (Math.abs(rotate) / 25) * 0.6;
                    card.style.transform = `translateX(${180 + clampedMove}px) scale(${scale}) rotateY(${rotate}deg)`;
                    card.style.opacity = opacity;
                    card.style.filter = `blur(${blur}px)`;
                    card.style.boxShadow = `${shadowX}px 15px ${10 + scale * 10}px rgba(0,0,0,${scale * 0.15})`;
                    card.style.setProperty('--glare-pos', `${glarePos}%`);
                    card.style.setProperty('--glare-opacity', glareOpacity);
                }
            });
        };

        // عند رفع الإصبع عن الشاشة (touchend)
        const handleDragEnd = (e) => {
            if (!isDragging) return;
            isDragging = false;
            carouselContainer.style.cursor = 'grab'; // إعادة المؤشر لشكله الطبيعي
            carouselContainer.classList.remove('dragging');

            // مسح التعديلات اليدوية ليعود التحكم للـ CSS لينفذ الحركة الانسيابية النهائية
            cards.forEach(card => {
                card.style.transform = '';
                card.style.opacity = '';
                card.style.filter = '';
                card.style.boxShadow = '';
                card.style.removeProperty('--glare-pos');
                card.style.removeProperty('--glare-opacity');
            });

            // الحصول على موضع النهاية وتحديد المسافة
            const endPos = e.type.includes('mouse') ? e.clientX : e.changedTouches[0].clientX;
            const movedBy = endPos - startPos;
            const swipeThreshold = 50; // عدد البكسلات اللازم لاعتبارها سحبة

            if (movedBy < -swipeThreshold) { // سحب لليسار (للانتقال للبطاقة التالية)
                goToNext();
            } else if (movedBy > swipeThreshold) { // سحب لليمين (للانتقال للبطاقة السابقة)
                goToPrev();
            }
            // إعادة ضبط المؤقت واستئناف التشغيل التلقائي
            startAutoPlay();
        };

        // ربط الأحداث بالدوال الموحدة
        carouselContainer.addEventListener('touchstart', handleDragStart, { passive: true });
        carouselContainer.addEventListener('touchmove', handleDragMove, { passive: true });
        carouselContainer.addEventListener('touchend', handleDragEnd);
        carouselContainer.addEventListener('mousedown', handleDragStart);
        carouselContainer.addEventListener('mousemove', handleDragMove);
        window.addEventListener('mouseup', handleDragEnd); // الاستماع على النافذة لضمان التقاط الحدث

        // منع السحب الافتراضي للمتصفح (خاصة على الصور)
        carouselContainer.addEventListener('dragstart', (e) => {
            e.preventDefault();
        });

        // === نهاية إضافة خاصية السحب ===

        // إنشاء النقاط وإضافة مستمعي الأحداث لها
        cards.forEach((_, i) => {
            const dot = document.createElement('span');
            dot.classList.add('dot');
            dot.addEventListener('click', () => {
                activeIndex = i;
                updateCarousel();
                startAutoPlay();
            });
            dotsContainer.appendChild(dot);
        });

        // 5. التشغيل الأولي عند تحميل الصفحة
        updateCarousel();
        startAutoPlay(); // بدء التشغيل التلقائي

        // === إضافة حركة ظهور المربعات عند التمرير (Fade-in on Scroll) ===
        const boxesSection = document.querySelector('.boxes-section');
        const scrollObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('show'); // تفعيل الأنيميشن
                    observer.unobserve(entry.target); // إيقاف المراقبة ليعمل مرة واحدة فقط
                }
            });
        }, { threshold: 0.15 }); // يبدأ الظهور عندما يدخل 15% من القسم إلى الشاشة

        if (boxesSection) scrollObserver.observe(boxesSection);
    </script>
</body>
</html>
